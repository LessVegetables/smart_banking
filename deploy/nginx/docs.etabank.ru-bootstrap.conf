# Temporary HTTP-only vhost used to issue the docs.etabank.ru TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name docs.etabank.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }
}
