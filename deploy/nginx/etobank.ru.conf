# nginx in front of the Docker stack for https://etobank.ru (VPS.md, «nginx»).
# The API listens on 127.0.0.1:8000 (compose.yaml + deploy/nginx/compose.nginx.yaml) and serves both the
# client build and /api; nginx only terminates TLS and proxies. Certificates: Let's Encrypt,
# `certbot certonly --nginx -d etobank.ru` before this file is enabled (the 443 block needs them).

server {
    listen 80;
    listen [::]:80;
    server_name etobank.ru;

    # certbot's nginx authenticator answers its own challenges here during issue and renewal.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name etobank.ru;

    ssl_certificate     /etc/letsencrypt/live/etobank.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etobank.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # No X-Frame-Options: Telegram's web client opens the mini app (/mini/) in an iframe.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Statement upload: up to 5 files of 2 MB each (apps/api/statements.py), plus multipart overhead.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# умныйкредитныйкабинет.рф → https://etobank.ru, keeping the path and the query string (UTM tags included):
# $request_uri is the original "/path?query" as the browser sent it. A link without utm_source gets
# utm_source=rf_domain, so analytics can tell this traffic apart; a link with one keeps its own.
# nginx matches the punycode name only.
map $arg_utm_source $rf_needs_source {
    ""      1;
    default 0;
}
# Key: "<needs source>:<query>|<request uri>". Regexes are tried in order.
map "$rf_needs_source:$args|$request_uri" $rf_utm_suffix {
    "~^1:\|.*\?$"  "utm_source=rf_domain";   # "/path?" with an empty query
    "~^1:\|"       "?utm_source=rf_domain";  # no query
    "~^1:"         "&utm_source=rf_domain";  # a query without utm_source
    default        "";
}

server {
    listen 80;
    listen [::]:80;
    server_name xn--80achddpccdgernff2bzbib6ni.xn--p1ai;
    return 301 https://etobank.ru$request_uri$rf_utm_suffix;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--80achddpccdgernff2bzbib6ni.xn--p1ai;

    # A separate certificate: `certbot certonly --nginx -d xn--80achddpccdgernff2bzbib6ni.xn--p1ai`.
    ssl_certificate     /etc/letsencrypt/live/xn--80achddpccdgernff2bzbib6ni.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80achddpccdgernff2bzbib6ni.xn--p1ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://etobank.ru$request_uri$rf_utm_suffix;
}
